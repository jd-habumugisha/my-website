<head>

    <title>i Show</title><style>

        body {
    position: relative;
    height: 100vh;
    background: url('log/Untitled design (2).png') center/cover no-repeat;
}

body::before {
    content: "";
    position: relative;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    
}
header{
    height:90vh;
    display:flex;   
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}


header h2{
    font-size:60px;
    animation:slideDown 2s ease;
}

header p{
    font-size:20px;
    margin-top:10px;
    animation:fadeIn 5s ease;
    color:white;
    opacity: 2;
    text-align: center;
}
@keyframes slideDown{
    from{
        transform:translateY(-100px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        transform: translate(-50px);
        opacity:0;
    }
    to{
        transform: translate(0);
        opacity:1;
    }
}
header button:hover{
padding: 10px;
transform: translateY(-1px);
}
header button{
margin-top: 11cm;
width: 4cm;
padding: 10px;
border: none;
background-color: rgb(102, 100, 100);
border-radius: 3px;
animation: fadeIn 5s ease ;
}
header button a{
color:rgb(246, 248, 248);
text-decoration-line: none;
}
header button:hover{
background-color: rgb(28, 105, 16);
}

@keyframes fadeIn{
    from{
    transform: translate(-100px);
    opacity: 0;
    }
to{
    transform: translate(0);
    opacity: 1;
  
}
}





    </style>
