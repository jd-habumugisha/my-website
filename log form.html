        .login-card {
            background: #172a35;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 30px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        /* Agasanduku bandikiramo */
        .input-group input {
            width: 100%;
            padding: 15px 10px;
            background: transparent;
            border: 1px solid #4a606b;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s ease;
        }

        /* Iri jambo naryo rirahinduka iyo ukanzeho */
        .input-group label {
            position:absolute;
            left: 10px;
            top: 15px;
            color: #88a0ab;
            pointer-events: none;
            transition:0.9s ease all;
            background-color: #172a35; /* Kugira ngo bitayivanga n'umurongo */
            padding: 0 5px;
        }

        /* AKAZI NYAMUKURU: Kuzamura label */
        /* Iyo ukanze mu gasanduku (:focus) cyangwa harimo inyuguti (!placeholder-shown) */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 8px;
            font-size: 10px;
            color: #32e6e2; /* Ibara rya Cyan */
        }

        .input-group input:focus {
            border-color: #32e6e2;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #32e6e2;
            border: none;
            border-radius: 5px;
            color: #0e1e25;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
    
        }

        .btn-login:hover {
            background-color: #02b3b0;
            transform: translateY(-1px);
        }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #88a0ab;
        }

        .footer-text a {
            color: #32e6e2;
            text-decoration: none;
